<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Library</title>
	<script src="app.js" defer></script>
	<link rel="stylesheet" href="style.css">
	</link>
</head>

<body>
	<header>
		<h1> LIBRARY...</h1>
		<button class="add-book-btn btn">Add book</button>
	</header>

	<div class="book-form-container">
		<button class="close">X</button>
		<form id="form">
			<label for="book-title">Book title:</label>
			<input type="text" id="book-title" name="title" class="input-text book-title" required>

			<label for="book-author">Author:</label>
			<input type="text" id="book-author" name="author" class="input-text book-author" required>

			<label for="book-pages">Pages:</label>
			<input type="number" id="book-pages" name="pages" min="0" class="input-text book-pages" required>

			<div>
				<div>
					<label for="book-read">Read:</label>
					<input type="checkbox" id="book-read" name="read" class="form-checkmark book-read">
				</div>
				<button class="submit-btn btn">Submit</button>
			</div>
		</form>
	</div>

	<main>

	</main>
</body>

</html>
